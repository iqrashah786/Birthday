<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Rumi 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#000000,#1a0a1a,#ff4e9a,#ff8dc7,#000000,#1a0a1a);display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.card{background:rgba(255,255,255,0.18);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.3);border-radius:32px;padding:32px 24px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.25);animation:pop 1s ease}
@keyframes pop{0%{transform:scale(0.5);opacity:0}100%{transform:scale(1);opacity:1}}
.emoji{font-size:60px;animation:bounce 1.5s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-size:38px;font-weight:900;color:white;line-height:1.1;margin-top:10px}
h1 span{background:white;color:#8b5cf6;padding:2px 14px;border-radius:14px;display:inline-block;margin-top:6px}
p{color:rgba(255,255,255,0.9);margin-top:18px;font-size:16px;line-height:1.5}
.btn{margin-top:28px;background:white;color:#8b5cf6;border:none;padding:14px 28px;border-radius:100px;font-size:17px;font-weight:800;box-shadow:0 10px 20px rgba(0,0,0,0.2);cursor:pointer}
.hint{color:rgba(255,255,255,0.6);font-size:12px;margin-top:16px}
.hearts{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.heart{position:absolute;animation:float 6s linear infinite;font-size:20px}
@keyframes float{0%{transform:translateY(100vh)}100%{transform:translateY(-10vh) rotate(360deg)}}
</style>
</head>
<body onclick="fireConfetti()">

<div class="hearts" id="hearts"></div>

<div class="card">
  <div class="emoji">🎉</div>
  <h1>Happy Birthday<br><span>Rumi 🎂</span></h1>
  <p>"You are not getting older, you are getting more precious✨🫠"
    "May the world for you Oyster🤲🏻"</p>
  <button class="btn" onclick="fireConfetti()">Celebrate 💖</button>
  <div class="hint">Tap Tap 🎊</div>
</div>

<script>
// Confetti
function fireConfetti(){
  confetti({particleCount:150,spread:90,origin:{y:0.6},colors:['#ffffff','#ff4e9a','#8b5cf6']});
  confetti({particleCount:80,angle:60,spread:55,origin:{x:0}});
  confetti({particleCount:80,angle:120,spread:55,origin:{x:1}});
}
setTimeout(fireConfetti,800);
//setInterval(fireConfetti,8000);

// Floating hearts
const heartsContainer = document.getElementById('hearts');
setInterval(()=>{
  const h = document.createElement('div');
  h.className='heart';
  h.innerHTML = ['💖','💜','💗','🎈','✨'][Math.floor(Math.random()*5)];
  h.style.left = Math.random()*100+'vw';
  h.style.animationDuration = (Math.random()*3+4)+'s';
  heartsContainer.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},900);
</script>
</body>
</html>
